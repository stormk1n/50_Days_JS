<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incrementing Counter</title>
    <link rel="stylesheet" href="./assets/sytles.css">
    <!-- google icons -->
    <link   href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>
    <div class="counter-container">
        <span class="material-symbols-outlined">owl</span>
        <div class="counter" data-target="12000"></div>
        <span>Twitter Followers</span>
    </div>

    <div class="counter-container">
        <span class="material-symbols-outlined">youtube_activity</span>
        <div class="counter" data-target="5000"></div>
        <span>Youtube Subscribers</span>
    </div>

    <div class="counter-container">
        <span class="material-symbols-outlined">format_textdirection_l_to_r</span>
        <div class="counter" data-target="7500"></div>
        <span>Facebook Fans</span>
    </div>

    <script src="./assets/script.js"></script>
</body>

</html>
